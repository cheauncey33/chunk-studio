[project]
name = "chunk-studio-backend"
version = "0.1.0"
description = "Local web tool to box-select PDF regions as knowledge-base chunks"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pymupdf>=1.24",
    "httpx>=0.27",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "aiofiles>=23.2",
]

[tool.uv]
package = false
