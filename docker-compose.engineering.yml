services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${CHUNK_STUDIO_PG_DATABASE:-chunkstudio}
      POSTGRES_USER: ${CHUNK_STUDIO_PG_USER:-chunkstudio}
      POSTGRES_PASSWORD: ${CHUNK_STUDIO_PG_PASSWORD:-chunkstudio_dev_only}
    ports:
      - "${CHUNK_STUDIO_PG_PORT:-55432}:5432"
    volumes:
      - chunk-studio-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${CHUNK_STUDIO_REDIS_PASSWORD:-chunkstudio_dev_only}"]
    ports:
      - "${CHUNK_STUDIO_REDIS_PORT:-56379}:6379"
    volumes:
      - chunk-studio-redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_ARGS} ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
    environment:
      REDIS_ARGS: ${CHUNK_STUDIO_REDIS_PASSWORD:-chunkstudio_dev_only}

  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${CHUNK_STUDIO_S3_ACCESS_KEY:-chunkstudio}
      MINIO_ROOT_PASSWORD: ${CHUNK_STUDIO_S3_SECRET_KEY:-chunkstudio_dev_only}
    ports:
      - "${CHUNK_STUDIO_S3_PORT:-59000}:9000"
      - "${CHUNK_STUDIO_S3_CONSOLE_PORT:-59001}:9001"
    volumes:
      - chunk-studio-minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: >-
      "mc alias set local http://minio:9000
      $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD}
      && mc mb --ignore-existing local/$${MINIO_BUCKET}"
    environment:
      MINIO_ROOT_USER: ${CHUNK_STUDIO_S3_ACCESS_KEY:-chunkstudio}
      MINIO_ROOT_PASSWORD: ${CHUNK_STUDIO_S3_SECRET_KEY:-chunkstudio_dev_only}
      MINIO_BUCKET: ${CHUNK_STUDIO_S3_BUCKET:-chunk-studio}

volumes:
  chunk-studio-postgres:
  chunk-studio-redis:
  chunk-studio-minio:
